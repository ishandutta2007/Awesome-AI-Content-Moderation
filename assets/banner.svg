<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a; #1e1b4b; #0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b; #311042; #1e1b4b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617; #0f172a; #020617" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Scanline / Laser Gradient -->
    <linearGradient id="scanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Text -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-width: 0.5; stroke-opacity: 0.3; }
    .node { fill: #38bdf8; opacity: 0.6; }
    
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-10px) scale(1.3); opacity: 0.9; }
    }
    
    @keyframes scan {
      0% { transform: translateY(-160px); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateY(160px); opacity: 0; }
    }

    @keyframes pulseAura {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.15); opacity: 0.4; }
    }

    .node-1 { animation: floatNode 4s ease-in-out infinite; }
    .node-2 { animation: floatNode 6s ease-in-out infinite 1s; }
    .node-3 { animation: floatNode 5s ease-in-out infinite 2s; }
    .scan-line { animation: scan 6s ease-in-out infinite; }
    .aura { transform-origin: center; animation: pulseAura 8s ease-in-out infinite; }
  </style>

  <!-- Base Rect -->
  <rect width="1200" height="320" fill="url(#bgGradient)" rx="16" />

  <!-- Background Decorative Grid -->
  <g opacity="0.4">
    <line x1="0" y1="40" x2="1200" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="320" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="320" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="320" class="grid-line" />
  </g>

  <!-- Glowing Background Orbs / Auras -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" class="aura" filter="url(#glow)" />
  <circle cx="1000" cy="220" r="160" fill="#c084fc" class="aura" filter="url(#glow)" />

  <!-- Dynamic Network Nodes -->
  <g id="network-nodes">
    <circle cx="150" cy="80" r="4" class="node node-1" />
    <circle cx="300" cy="240" r="5" class="node node-2" />
    <circle cx="450" cy="60" r="3" class="node node-3" />
    <circle cx="750" cy="260" r="4" class="node node-1" />
    <circle cx="900" cy="70" r="5" class="node node-2" />
    <circle cx="1050" cy="220" r="4" class="node node-3" />
  </g>

  <!-- Scanning Laser Beam -->
  <rect x="0" y="158" width="1200" height="4" fill="url(#scanGradient)" class="scan-line" />

  <!-- Shield Security Emblem -->
  <g transform="translate(600, 75)" filter="url(#glow)">
    <path d="M0 -30 L25 -15 L25 15 L0 30 L-25 15 L-25 -15 Z" fill="none" stroke="url(#accentGradient)" stroke-width="2.5" opacity="0.7" />
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always Sharp and Visible) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Category Pill Badge -->
    <rect x="475" y="42" width="250" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="600" y="61" fill="#38bdf8" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">🛡️ TRUST &amp; SAFETY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
      <tspan fill="url(#accentGradient)">Awesome AI Content Moderation</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#94a3b8" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.3">
      Curated Commercial SaaS APIs • Self-Hosted Open-Source Models • LLM Safety Guardrails
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 235)" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      <text x="360" y="0">⚡ Toxicity Detection</text>
      <text x="520" y="0">🔞 NSFW Filtering</text>
      <text x="660" y="0">💬 Hate Speech</text>
      <text x="810" y="0">🔒 LLM Guardrails</text>
    </g>
  </g>
</svg>
